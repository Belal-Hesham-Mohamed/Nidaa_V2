name: Align Qibla Light Theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'chore: apply qibla and azkar theme fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          colors = Path('lib/core/constant/app_color.dart')
          text = colors.read_text()
          text = text.replace(
              'static const qiblaLightBackgroundTop = Color(0xFFEFF7FB);\n'
              '  static const qiblaLightBackgroundMiddle = Color(0xFFE4F0F6);\n'
              '  static const qiblaLightBackgroundBottom = Color(0xFFD7E7EF);',
              'static const qiblaLightBackgroundTop = Color(0xFFF6F9FC);\n'
              '  static const qiblaLightBackgroundMiddle = Color(0xFFEAF2F8);\n'
              '  static const qiblaLightBackgroundBottom = Color(0xFFE1EDF3);',
          )
          text = text.replace(
              '  static const qiblaCompassSurface = Color(0xFF08212C);\n'
              '  static const qiblaCompassRing = Color(0xFF5BC0BE);\n'
              '  static const qiblaCompassRingAligned = Color(0xFF69E38A);\n'
              '  static const qiblaAccentGold = Color(0xFFF4D58D);\n'
              '  static const qiblaGuide = Color(0xFF8AA8B2);',
              '  static const qiblaCompassSurface = Color(0xFF08212C);\n'
              '  static const qiblaCompassRing = Color(0xFF5BC0BE);\n'
              '  static const qiblaCompassRingAligned = Color(0xFF69E38A);\n'
              '  static const qiblaAccentGold = Color(0xFFF4D58D);\n'
              '  static const qiblaGuide = Color(0xFF8AA8B2);\n\n'
              '  // Light Qibla palette aligned with the app light theme.\n'
              '  static const qiblaLightCompassSurface = Color(0xFFFFFFFF);\n'
              '  static const qiblaLightCompassRing = Color(0xFF3B82F6);\n'
              '  static const qiblaLightCompassRingAligned = Color(0xFF4CAF7D);',
          )
          colors.write_text(text)

          azkar = Path('lib/azkar/presentation/screens/azkar_home_screen.dart')
          text = azkar.read_text()
          old = '''        return SingleChildScrollView(\n          padding: const EdgeInsets.fromLTRB(16, 12, 16, 28),\n          child: Column('''
          new = '''        return DecoratedBox(\n          decoration: BoxDecoration(\n            gradient: LinearGradient(\n              begin: Alignment.topCenter,\n              end: Alignment.bottomCenter,\n              colors: _backgroundGradient(context),\n              stops: const [0.0, 0.48, 1.0],\n            ),\n          ),\n          child: SingleChildScrollView(\n            padding: const EdgeInsets.fromLTRB(16, 12, 16, 28),\n            child: Column('''
          if old not in text:
              raise SystemExit('Azkar home insertion point not found')
          text = text.replace(old, new)
          old = '''              ),\n            ],\n          ),\n        );\n      },\n    );\n  }\n\n  CurrentAzkarPeriod _fallbackPeriod()'''
          new = '''              ),\n            ],\n          ),\n          ),\n        );\n      },\n    );\n  }\n\n  List<Color> _backgroundGradient(BuildContext context) {\n    final dark = Theme.of(context).brightness == Brightness.dark;\n    return dark\n        ? const [\n            AppColors.qiblaBackgroundTop,\n            AppColors.qiblaBackgroundMiddle,\n            AppColors.qiblaBackgroundBottom,\n          ]\n        : const [\n            AppColors.qiblaLightBackgroundTop,\n            AppColors.qiblaLightBackgroundMiddle,\n            AppColors.qiblaLightBackgroundBottom,\n          ];\n  }\n\n  CurrentAzkarPeriod _fallbackPeriod()'''
          if old not in text:
              raise SystemExit('Azkar home closing insertion point not found')
          text = text.replace(old, new, 1)
          azkar.write_text(text)

          qibla = Path('lib/qibla/presentation/screens/qibla_screen.dart')
          text = qibla.read_text()

          text = text.replace(
              '''    final accentColor = isAligned\n        ? AppColors.qiblaCompassRingAligned\n        : AppColors.qiblaCompassRing;\n    final arrowColor = isAligned\n        ? AppColors.qiblaCompassRingAligned\n        : AppColors.qiblaAccentGold;''',
              '''    final isDark = Theme.of(context).brightness == Brightness.dark;\n    final accentColor = isAligned\n        ? (isDark\n            ? AppColors.qiblaCompassRingAligned\n            : AppColors.qiblaLightCompassRingAligned)\n        : (isDark\n            ? AppColors.qiblaCompassRing\n            : AppColors.qiblaLightCompassRing);\n    final arrowColor = isAligned\n        ? (isDark\n            ? AppColors.qiblaCompassRingAligned\n            : AppColors.qiblaLightCompassRingAligned)\n        : (isDark ? AppColors.qiblaAccentGold : AppColors.lightAccentBlue);''',
          )
          text = text.replace(
              '''                  style: const TextStyle(\n                    color: AppColors.darkPrimaryText,\n                    fontSize: 30,''',
              '''                  style: TextStyle(\n                    color: isDark\n                        ? AppColors.darkPrimaryText\n                        : AppColors.lightPrimaryText,\n                    fontSize: 30,''',
          )
          text = text.replace(
              '''                  style: const TextStyle(\n                    color: AppColors.darkSecondaryText,\n                    fontSize: 14,''',
              '''                  style: TextStyle(\n                    color: isDark\n                        ? AppColors.darkSecondaryText\n                        : AppColors.lightSecondaryText,\n                    fontSize: 14,''',
          )

          text = text.replace(
              '''    return Semantics(\n      label: QiblaStrings.of(context).title,''',
              '''    final isDark = Theme.of(context).brightness == Brightness.dark;\n    final compassSurface = isDark\n        ? AppColors.qiblaCompassSurface\n        : AppColors.qiblaLightCompassSurface;\n\n    return Semantics(\n      label: QiblaStrings.of(context).title,''',
          )
          text = text.replace(
              'color: AppColors.qiblaCompassSurface,',
              'color: compassSurface,',
          )
          text = text.replace(
              '''              const _CompassTicks(),''',
              '''              _CompassTicks(isDark: isDark),''',
          )
          text = text.replace(
              '''              const CircularProgressIndicator(\n                color: AppColors.qiblaAccentGold,\n              ),''',
              '''              CircularProgressIndicator(color: arrowColor),''',
          )

          text = text.replace(
              '''class _CompassTicks extends StatelessWidget {\n  const _CompassTicks();''',
              '''class _CompassTicks extends StatelessWidget {\n  const _CompassTicks({required this.isDark});\n\n  final bool isDark;''',
          )
          text = text.replace(
              '''        painter: _CompassTicksPainter(),''',
              '''        painter: _CompassTicksPainter(\n          color: isDark\n              ? AppColors.darkSecondaryText\n              : AppColors.lightSecondaryText,\n        ),''',
          )
          text = text.replace(
              '''class _CompassTicksPainter extends CustomPainter {\n  @override\n  void paint''',
              '''class _CompassTicksPainter extends CustomPainter {\n  const _CompassTicksPainter({required this.color});\n\n  final Color color;\n\n  @override\n  void paint''',
          )
          text = text.replace(
              '''        ..color = major\n            ? AppColors.darkSecondaryText\n            : AppColors.darkSecondaryText.withValues(alpha: 0.3)''',
              '''        ..color = major\n            ? color\n            : color.withValues(alpha: 0.3)''',
          )
          text = text.replace(
              '''  bool shouldRepaint(covariant CustomPainter oldDelegate) => false;''',
              '''  bool shouldRepaint(covariant _CompassTicksPainter oldDelegate) =>\n      oldDelegate.color != color;''',
              1,
          )

          text = text.replace(
              '''    return Text(\n      label,\n      style: const TextStyle(\n        color: AppColors.darkPrimaryText,''',
              '''    final isDark = Theme.of(context).brightness == Brightness.dark;\n    return Text(\n      label,\n      style: TextStyle(\n        color: isDark\n            ? AppColors.darkPrimaryText\n            : AppColors.lightPrimaryText,''',
          )
          text = text.replace(
              '''    return Center(\n      child: Container(\n        width: 22,''',
              '''    final isDark = Theme.of(context).brightness == Brightness.dark;\n    final accent = isDark\n        ? AppColors.qiblaAccentGold\n        : AppColors.lightAccentBlue;\n    return Center(\n      child: Container(\n        width: 22,''',
          )
          text = text.replace(
              'color: AppColors.darkBackground,\n          borderRadius: BorderRadius.circular(3),\n          border: Border.all(color: AppColors.qiblaAccentGold, width: 1.5),',
              'color: isDark ? AppColors.darkBackground : AppColors.lightSurface,\n          borderRadius: BorderRadius.circular(3),\n          border: Border.all(color: accent, width: 1.5),',
          )
          text = text.replace(
              'color: AppColors.qiblaAccentGold,\n            ),',
              'color: accent,\n            ),',
              1,
          )

          text = text.replace(
              '''    final strings = QiblaStrings.of(context);\n\n    return Container(\n      width: double.infinity,''',
              '''    final strings = QiblaStrings.of(context);\n    final isDark = Theme.of(context).brightness == Brightness.dark;\n    final cardColor = isDark\n        ? AppColors.darkSurface.withValues(alpha: 0.78)\n        : AppColors.lightSurface.withValues(alpha: 0.92);\n    final borderColor = isDark\n        ? AppColors.darkAccentTeal\n        : AppColors.lightAccentBlue;\n    final secondaryText = isDark\n        ? AppColors.darkSecondaryText\n        : AppColors.lightSecondaryText;\n    final primaryText = isDark\n        ? AppColors.darkPrimaryText\n        : AppColors.lightPrimaryText;\n    final iconAccent = isDark\n        ? AppColors.qiblaAccentGold\n        : AppColors.lightAccentBlue;\n\n    return Container(\n      width: double.infinity,''',
          )
          text = text.replace('color: AppColors.darkSurface.withValues(alpha: 0.78),', 'color: cardColor,')
          text = text.replace('color: AppColors.darkAccentTeal.withValues(alpha: 0.22),', 'color: borderColor.withValues(alpha: 0.22),')
          text = text.replace('color: AppColors.darkSecondaryText.withValues(alpha: 0.12),', 'color: secondaryText.withValues(alpha: 0.12),')
          text = text.replace('color: AppColors.qiblaAccentGold,\n              size: 28,', 'color: iconAccent,\n              size: 28,')

          text = text.replace(
              '''  @override\n  Widget build(BuildContext context) {\n    return Row(\n      children: [''',
              '''  @override\n  Widget build(BuildContext context) {\n    final isDark = Theme.of(context).brightness == Brightness.dark;\n    final secondaryText = isDark\n        ? AppColors.darkSecondaryText\n        : AppColors.lightSecondaryText;\n    final primaryText = isDark\n        ? AppColors.darkPrimaryText\n        : AppColors.lightPrimaryText;\n\n    return Row(\n      children: [''',
              1,
          )
          text = text.replace('color: AppColors.darkSecondaryText,\n              fontSize: 14,', 'color: secondaryText,\n              fontSize: 14,', 1)
          text = text.replace('color: AppColors.darkPrimaryText,\n            fontSize: 22,', 'color: primaryText,\n            fontSize: 22,', 1)

          text = text.replace(
              '''    final strings = QiblaStrings.of(context);\n    return Center(\n      child: Column(''',
              '''    final strings = QiblaStrings.of(context);\n    final isDark = Theme.of(context).brightness == Brightness.dark;\n    final secondaryText = isDark\n        ? AppColors.darkSecondaryText\n        : AppColors.lightSecondaryText;\n    final primaryText = isDark\n        ? AppColors.darkPrimaryText\n        : AppColors.lightPrimaryText;\n    final accent = isDark ? AppColors.qiblaAccentGold : AppColors.lightAccentBlue;\n    return Center(\n      child: Column(''',
              1,
          )
          text = text.replace('const CircularProgressIndicator(color: AppColors.qiblaAccentGold),', 'CircularProgressIndicator(color: accent),', 1)
          text = text.replace('style: const TextStyle(color: AppColors.darkSecondaryText),', 'style: TextStyle(color: secondaryText),', 1)

          text = text.replace(
              '''    final strings = QiblaStrings.of(context);\n    return Center(\n      child: Padding(''',
              '''    final strings = QiblaStrings.of(context);\n    final isDark = Theme.of(context).brightness == Brightness.dark;\n    final secondaryText = isDark\n        ? AppColors.darkSecondaryText\n        : AppColors.lightSecondaryText;\n    final primaryText = isDark\n        ? AppColors.darkPrimaryText\n        : AppColors.lightPrimaryText;\n    return Center(\n      child: Padding(''',
              1,
          )
          text = text.replace('''              color: AppColors.darkSecondaryText,\n            ),''', '''              color: secondaryText,\n            ),''', 1)
          text = text.replace('''                color: AppColors.darkPrimaryText,\n                fontSize: 18,''', '''                color: primaryText,\n                fontSize: 18,''', 1)
          text = text.replace('''                color: AppColors.darkSecondaryText,\n                fontSize: 14,''', '''                color: secondaryText,\n                fontSize: 14,''', 1)

          qibla.write_text(text)
          PY
      - name: Verify changes
        run: |
          grep -q 'qiblaLightBackgroundTop = Color(0xFFF6F9FC)' lib/core/constant/app_color.dart
          grep -q 'qiblaLightCompassRing = Color(0xFF3B82F6)' lib/core/constant/app_color.dart
          grep -q '_backgroundGradient' lib/azkar/presentation/screens/azkar_home_screen.dart
          grep -q 'qiblaLightCompassSurface' lib/qibla/presentation/screens/qibla_screen.dart
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/constant/app_color.dart lib/azkar/presentation/screens/azkar_home_screen.dart lib/qibla/presentation/screens/qibla_screen.dart
          git diff --cached --quiet || git commit -m 'chore: apply qibla and azkar theme fixes'
          git push
