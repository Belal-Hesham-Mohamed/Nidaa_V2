name: Fix shared theme background

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Fix shared theme background on Qibla and Settings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme-aware shared background
        shell: python
        run: |
          from pathlib import Path

          qibla = Path('lib/qibla/presentation/screens/qibla_screen.dart')
          text = qibla.read_text()
          old = '''    return DecoratedBox(\n      decoration: const BoxDecoration(\n        gradient: LinearGradient(\n          begin: Alignment.topCenter,\n          end: Alignment.bottomCenter,\n          colors: [\n            AppColors.qiblaBackgroundTop,\n            AppColors.qiblaBackgroundMiddle,\n            AppColors.qiblaBackgroundBottom,\n          ],\n          stops: [0.0, 0.48, 1.0],\n        ),\n      ),'''
          new = '''    final isDark = Theme.of(context).brightness == Brightness.dark;\n\n    return DecoratedBox(\n      decoration: BoxDecoration(\n        gradient: LinearGradient(\n          begin: Alignment.topCenter,\n          end: Alignment.bottomCenter,\n          colors: isDark\n              ? const [\n                  AppColors.qiblaBackgroundTop,\n                  AppColors.qiblaBackgroundMiddle,\n                  AppColors.qiblaBackgroundBottom,\n                ]\n              : const [\n                  AppColors.qiblaLightBackgroundTop,\n                  AppColors.qiblaLightBackgroundMiddle,\n                  AppColors.qiblaLightBackgroundBottom,\n                ],\n          stops: const [0.0, 0.48, 1.0],\n        ),\n      ),'''
          if old not in text:
              raise SystemExit('Qibla background block not found')
          qibla.write_text(text.replace(old, new, 1))

          settings = Path('lib/settings/presentation/screens/settings_screen.dart')
          text = settings.read_text()
          old = '''        decoration: const BoxDecoration(\n          gradient: LinearGradient(\n            begin: Alignment.topCenter,\n            end: Alignment.bottomCenter,\n            colors: [\n              AppColors.qiblaBackgroundTop,\n              AppColors.qiblaBackgroundMiddle,\n              AppColors.qiblaBackgroundBottom,\n            ],\n            stops: [\n              0.0,\n              0.48,\n              1.0,\n            ],\n          ),\n        ),'''
          new = '''        decoration: BoxDecoration(\n          gradient: LinearGradient(\n            begin: Alignment.topCenter,\n            end: Alignment.bottomCenter,\n            colors: isDark\n                ? const [\n                    AppColors.qiblaBackgroundTop,\n                    AppColors.qiblaBackgroundMiddle,\n                    AppColors.qiblaBackgroundBottom,\n                  ]\n                : const [\n                    AppColors.qiblaLightBackgroundTop,\n                    AppColors.qiblaLightBackgroundMiddle,\n                    AppColors.qiblaLightBackgroundBottom,\n                  ],\n            stops: const [0.0, 0.48, 1.0],\n          ),\n        ),'''
          if old not in text:
              raise SystemExit('Settings background block not found')
          settings.write_text(text.replace(old, new, 1))
      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/qibla/presentation/screens/qibla_screen.dart lib/settings/presentation/screens/settings_screen.dart
          git rm .github/workflows/fix-shared-background.yml
          git commit -m 'Fix shared theme background on Qibla and Settings'
          git push origin main
