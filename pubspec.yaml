name: nidaa_v2
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8
  country_state_city: ^0.1.6
  csc_picker_plus: ^0.0.3
  dartz: ^0.10.1
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_compass: ^0.8.0
  flutter_localizations:
    sdk: flutter
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  get_it: ^9.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  internet_connection_checker_plus: ^3.1.1
  intl: ^0.20.2

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/light_background.png

flutter_intl:
  enabled: true
